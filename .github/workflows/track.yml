name: track

# Follow the upstream tracked branch: sync the fork, run the flow on the
# self-hosted runner, publish results to the `data` branch and the dashboard.
# No push or pull_request triggers: the runner only serves these two.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: Upstream SHAs, space separated (empty = tracked branch head)
        default: ''
      targets:
        description: Targets, space separated (empty = all in synthesis.yaml)
        default: ''
      techs:
        description: Technologies, space separated
        default: asap7 nangate45
      mode:
        description: Run mode
        type: choice
        options: [fast, opt]
        default: fast
      force:
        description: Re-run even if data exists
        type: boolean
        default: false

concurrency: track

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FORK_KEY: ${{ secrets.FORK_DEPLOY_KEY }}
      FORK: ${{ vars.FORK_REPO }}
      UPSTREAM: ${{ vars.UPSTREAM_REPO }}
      BRANCH: ${{ vars.TRACKED_BRANCH }}
      IN_SHA: ${{ inputs.sha }}
      IN_TARGETS: ${{ inputs.targets }}
      IN_TECHS: ${{ inputs.techs || 'asap7 nangate45' }}
      IN_MODE: ${{ inputs.mode || 'fast' }}
      FORCE: ${{ inputs.force || false }}
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      skipped: ${{ steps.plan.outputs.skipped }}
    steps:
      - name: Sync fork and rebase ft-synthesis
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/key"
          printf '%s\n' "$FORK_KEY" > "$RUNNER_TEMP/key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q "git@github.com:$FORK.git" fork
          cd fork
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch -q upstream "$BRANCH"
          # Fast-forward only: a non-fast-forward update is rejected and fails the job.
          git push origin "refs/remotes/upstream/$BRANCH:refs/heads/$BRANCH"
          git checkout -q -B ft-synthesis origin/ft-synthesis
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rebase "upstream/$BRANCH" || { git rebase --abort; exit 1; }
          git push --force-with-lease=ft-synthesis:"$(git rev-parse origin/ft-synthesis)" origin ft-synthesis

      - name: Plan
        id: plan
        working-directory: fork
        run: |
          head=$(git rev-parse "upstream/$BRANCH")
          runs=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/runs.json?ref=data" 2>/dev/null) || runs='[]'
          last=$(jq -r 'max_by(.upstream_date).upstream_sha // empty' <<<"$runs")
          targets=${IN_TARGETS:-$(git show origin/ft-synthesis:synthesis.yaml | yq '.targets | keys | .[]')}
          matrix='[]'
          skipped=''
          for in_sha in ${IN_SHA:-$head}; do
            sha=$(git rev-parse --verify "$in_sha^{commit}")
            # Skip a commit whose RTL equals that of the newest published commit.
            if [ "$FORCE" != true ] && [ -n "$last" ] \
                && git diff --quiet "$last" "$sha" -- core common vendor corev_apu 2>/dev/null; then
              skipped="$skipped $sha"
              continue
            fi
            matrix=$(jq -c --arg t "$targets" --arg x "$IN_TECHS" --arg m "$IN_MODE" --arg sha "$sha" \
              --argjson old "$([ "$sha" != "$head" ] && echo true || echo false)" \
              --argjson runs "$runs" --argjson force "$FORCE" '
              . + [ ($t | scan("[^ \n]+")) as $a | ($x | scan("[^ ]+")) as $b
                | select($force or ($runs | any(.upstream_sha == $sha and .target == $a
                    and .technology == $b and .mode == $m) | not))
                | {sha: $sha, short: $sha[0:7], old: $old, target: $a, tech: $b} ]' <<<"$matrix")
          done
          {
            echo "mode=$IN_MODE"
            echo "matrix=$matrix"
            echo "skipped=${skipped# }"
          } >> "$GITHUB_OUTPUT"
          echo "$(jq length <<<"$matrix") run(s); skipped (no RTL change):${skipped:- none}" >> "$GITHUB_STEP_SUMMARY"

      # Recent commits of the tracked branch, newest first. "rtl" is false when
      # the commit does not change the RTL, so it shares the results of its parent.
      - name: List upstream commits
        working-directory: fork
        run: |
          for c in $(git rev-list --first-parent -n 100 "upstream/$BRANCH"); do
            rtl=true
            git diff --quiet "$c^" "$c" -- core common vendor corev_apu 2>/dev/null && rtl=false
            git log -1 --format='%H%x09%cI%x09%s' "$c" \
              | jq -R --argjson rtl "$rtl" 'split("\t") | {sha: .[0], date: .[1], title: .[2], rtl: $rtl}'
          done | jq -s . > ../commits.json

      - uses: actions/upload-artifact@v7
        with:
          name: commits
          path: commits.json

  flow:
    name: flow ${{ matrix.target }} ${{ matrix.tech }} ${{ matrix.short }}
    needs: sync
    if: needs.sync.outputs.matrix != '[]'
    runs-on: [self-hosted, cva6-synthesis]
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      max-parallel: ${{ fromJSON(vars.FLOW_PARALLEL || '1') }}
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.sync.outputs.matrix) }}
    env:
      SHA: ${{ matrix.sha }}
      MODE: ${{ needs.sync.outputs.mode }}
      TARGET: ${{ matrix.target }}
      TECH: ${{ matrix.tech }}
      DENYLIST: /etc/cva6-denylist
      FLOW_PARALLEL: ${{ vars.FLOW_PARALLEL || '1' }}
      COMPOSE_VERSION: v5.6.0
      COMPOSE_SHA256: 40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.FORK_REPO }}
          ref: ft-synthesis
          ssh-key: ${{ secrets.FORK_DEPLOY_KEY }}
          fetch-depth: 0

      # The tool-compatibility commits (ft-synthesis on top of the tracked branch,
      # except its last commit) apply to the older commit too.
      - name: Check out the older upstream commit
        if: matrix.old
        env:
          BRANCH: ${{ vars.TRACKED_BRANCH }}
        run: |
          fixes=$(git rev-list --reverse "origin/$BRANCH..ft-synthesis~1")
          git checkout -q "$SHA"
          [ -z "$fixes" ] || git -c user.name=ci -c user.email=ci@example.invalid cherry-pick $fixes
          git checkout ft-synthesis -- synthesis.yaml .gitmodules synthesis

      # The flow submodule is fetched from the repository running this workflow,
      # so staging tests its own commits. .gitmodules is left untouched.
      - name: Check out the flow
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config submodule.synthesis.url "https://github.com/${{ github.repository }}.git"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            submodule update --init --recursive
          # The flow version (git describe) needs the tags of the flow.
          git -C synthesis -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch -q --tags origin

      - name: Install docker compose
        run: |
          plugins=~/.docker/cli-plugins
          mkdir -p "$plugins"
          curl -fsSL --retry 5 --retry-all-errors -o "$plugins/docker-compose" \
            "https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-x86_64"
          echo "$COMPOSE_SHA256  $plugins/docker-compose" | sha256sum -c -
          chmod +x "$plugins/docker-compose"

      # Each runner has its own Compose project: remove the tool containers that
      # a cancelled job of this runner left running.
      - name: Remove stale tool containers
        run: |
          docker ps -aq --filter "label=com.docker.compose.project=cva6-synthesis-$RUNNER_NAME" \
            | xargs -r docker rm -f

      - name: Run flow
        # Half of the Docker CPUs, shared by the parallel runs.
        run: |
          export CVA6_SYNTH_CPUS=$(( $(docker info --format '{{.NCPU}}') / 2 / FLOW_PARALLEL ))
          export CVA6_SYNTH_PROJECT="cva6-synthesis-$RUNNER_NAME"
          # On the work mount that all runners share: one simulation at a time,
          # so it can use a quarter of the CPUs.
          export CVA6_SYNTH_GSIM_LOCK=/srv/cva6-runner/gsim.lock
          export CVA6_SYNTH_GSIM_CPUS=$(( $(docker info --format '{{.NCPU}}') / 4 ))
          # Gate-level simulation for the tracked head only, for now.
          export CVA6_SYNTH_GSIM=${{ matrix.old && '0' || '1' }}
          # The logs of every run, in one folder on the workstation (archive.sh).
          export CVA6_SYNTH_ARCHIVE=/srv/cva6-runner/archive
          CVA6_UPSTREAM_REF="$SHA" ./synthesis/run.sh --target "$TARGET" --tech "$TECH" --mode "$MODE"

      - name: Anonymisation check
        id: anon
        if: always()
        run: |
          dir=$(readlink -f "synthesis/runs/$TARGET/$TECH/$MODE/latest")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if grep -rIlFf "$DENYLIST" "$dir"; then
            echo "::error::deny-list match in the files listed above"
            exit 1
          fi

      # A failed run still uploads its failed results.json.
      - uses: actions/upload-artifact@v7
        id: upload
        if: always() && steps.anon.outcome == 'success'
        continue-on-error: true
        with:
          name: run-${{ matrix.sha }}-${{ matrix.target }}-${{ matrix.tech }}
          path: |
            ${{ steps.anon.outputs.dir }}/results.json
            ${{ steps.anon.outputs.dir }}/metrics.json
            ${{ steps.anon.outputs.dir }}/metadata.txt
            ${{ steps.anon.outputs.dir }}/gsim.log
          retention-days: 7

      # One retry after a pause: name resolution on the runner fails at times.
      - name: Retry the upload
        id: retry
        if: always() && steps.upload.outcome == 'failure'
        run: sleep 60

      - uses: actions/upload-artifact@v7
        if: always() && steps.retry.outcome == 'success'
        with:
          name: run-${{ matrix.sha }}-${{ matrix.target }}-${{ matrix.tech }}
          overwrite: true
          path: |
            ${{ steps.anon.outputs.dir }}/results.json
            ${{ steps.anon.outputs.dir }}/metrics.json
            ${{ steps.anon.outputs.dir }}/metadata.txt
            ${{ steps.anon.outputs.dir }}/gsim.log
          retention-days: 7

      - name: Clean run directory
        if: always()
        run: rm -rf synthesis/runs

  publish:
    needs: [sync, flow]
    if: always() && needs.sync.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SKIPPED: ${{ needs.sync.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: run-*
          path: art

      - uses: actions/download-artifact@v8
        with:
          name: commits
          path: art-commits

      - name: Update data branch
        run: |
          if git fetch -q origin data; then
            git worktree add -q -B data data FETCH_HEAD
          else
            git worktree add -q --orphan -b data data
          fi
          cd data
          mkdir -p runs
          for f in $(find ../art -name results.json); do
            dest=runs/$(jq -r '[.upstream_sha, .target, .technology, .mode] | join("/")' "$f")
            rm -rf "$dest"
            mkdir -p "$dest"
            cp "$(dirname "$f")"/* "$dest/"
          done
          for sha in $SKIPPED; do
            [ -e "runs/$sha" ] && continue
            mkdir -p "runs/$sha"
            jq -n --arg s "$sha" '{upstream_sha: $s, status: "skipped", reason: "no RTL change"}' > "runs/$sha/skipped.json"
          done
          jq -s . /dev/null $(find runs -name results.json | sort) > runs.json
          cp ../art-commits/commits.json commits.json
          git add -A
          git diff --cached --quiet && { echo "Nothing to publish"; exit 0; }
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Results: $(find ../art -name results.json | wc -l) run(s)"
          git push -q origin data

      - name: Build dashboard
        run: python3 dashboard/generate.py data/runs.json site

      # One artifact per attempt: a re-run of failed jobs would otherwise find
      # the artifact of the first attempt as well.
      - uses: actions/upload-pages-artifact@v5
        if: vars.DEPLOY_PAGES == 'true'
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

  pages:
    needs: publish
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
