# One self-hosted GitHub Actions runner in one container, registered to one repository.
# start.sh starts one Compose project per runner and sets REPO, RUNNER_NAME,
# RUNNER_TOKEN, DENYLIST and RUNNER_CPUS.

services:
  runner:
    image: ghcr.io/actions/actions-runner@sha256:e275409999c37162649aa050ca573f03eab2eabcb3a1e7fcc47548de6b4f9690
    container_name: ${RUNNER_NAME:?}
    hostname: ${RUNNER_NAME:?}
    init: true
    restart: unless-stopped
    cpus: ${RUNNER_CPUS:?}
    environment:
      REPO: ${REPO:?}
      RUNNER_NAME: ${RUNNER_NAME:?}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?}
    volumes:
      # Docker Desktop maps this path to its engine socket (no file sharing involved).
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path on the host and in the container, so tool containers started
      # through the socket can mount the job's files.
      - /srv/cva6-runner:/srv/cva6-runner
      - ${DENYLIST:?}:/etc/cva6-denylist:ro
    # Register once (a restart reuses .runner), then drop the token before jobs start.
    # The socket is root:root 0660 in Docker Desktop: give it to the image's docker
    # group. Do not use group_add 0: a mkdir with group 0 crashes Docker Desktop's
    # virtiofs daemon for /srv/cva6-runner and hangs the engine.
    command:
      - bash
      - -c
      - |
        sudo chgrp docker /var/run/docker.sock
        [ -f .runner ] || ./config.sh --unattended --replace \
          --url "https://github.com/$$REPO" --token "$$RUNNER_TOKEN" \
          --name "$$RUNNER_NAME" --labels cva6-synthesis --work "/srv/cva6-runner/$$RUNNER_NAME"
        unset RUNNER_TOKEN
        exec ./run.sh
